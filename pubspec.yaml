name: teenancial
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  intl: ^0.20.3
  go_router: ^18.0.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#EDEFE2"
  image: assets/images/logo_teenancial_splash.png
  android_12:
    color: "#EDEFE2"
    image: assets/images/logo_teenancial_splash.png
    icon_background_color: "#EDEFE2"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo_teenancial_splash.png
  adaptive_icon_background: "#EDEFE2"
  adaptive_icon_foreground: assets/images/logo_teenancial_splash.png
